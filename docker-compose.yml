services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: designhub
      POSTGRES_USER: designhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-designhub_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designhub -d designhub"]
      interval: 5s
      timeout: 5s
      retries: 12
  web-service:
    build: ./web-service
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://designhub:${DB_PASSWORD:-designhub_local_password}@db:5432/designhub
      PRICING_URL: http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  postgres_data:
